<div class="pm-wrap">
  <div class="pm-header">
    <div class="pm-header-main">
      <h2 class="pm-title">{{ project.name }}</h2>
      <span *ngIf="project.year" class="pm-year">{{ project.year }}</span>
    </div>
    <button class="pm-close" (click)="closeProjectModal()">✕</button>
  </div>

  <div class="pm-body">
    <div class="pm-carousel" *ngIf="project.images.length">
      <app-carousel [images]="project.images"></app-carousel>
    </div>

    <div class="pm-info">
      <p class="pm-section-label">{{ 'MODAL.DESCRIPTION' | translate }}</p>
      <p class="pm-description">{{ project.descriptionKey | translate }}</p>

      <div class="pm-links">
        <a *ngIf="project.projectLink" [href]="project.projectLink" target="_blank" rel="noopener" class="pm-visit-btn">
          {{ 'MODAL.VISIT' | translate }} →
        </a>
        <a *ngIf="project.repoLink" [href]="project.repoLink" target="_blank" rel="noopener" class="pm-repo-btn">
          {{ 'MODAL.CODE' | translate }} →
        </a>
      </div>

      <div class="pm-tags">
        <span *ngFor="let tag of project.technologies"
              class="tag"
              [style.color]="tag.color">{{ tag }}</span>
      </div>
    </div>
  </div>
</div>
