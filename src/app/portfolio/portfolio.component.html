<app-section-header eyebrowKey="PORTFOLIO.EYEBROW" headingKey="PORTFOLIO.TITLE" subKey="PORTFOLIO.DESC"></app-section-header>

<div class="filter-bar">
  <button type="button" class="filter-toggle" (click)="toggleCollapse()" [class.open]="!isCollapsed">
    <span class="filter-toggle-icon">{{ isCollapsed ? '+' : '−' }}</span>
    {{ 'PORTFOLIO.FILTER' | translate }}
    @if (filtering) {
      <span class="filter-count">{{ selectedTags.length }}</span>
    }
  </button>
  <button type="button" class="filter-clear" (click)="clearFilter()" [hidden]="!filtering">{{ 'PORTFOLIO.CLEAR' | translate }}</button>
  <span class="filter-rule"></span>
  <span class="filter-total">{{ projects.length }} / {{ totalProjects }}</span>
</div>

<div [@expandCollapse]="isCollapsed ? 'collapsed' : 'expanded'">
  <div class="filter-tags">
    @for (tag of availableTags; track tag) {
      <button
        type="button"
        class="tag filter-tag"
        [class.selected]="isSelected(tag)"
      (click)="toggleTag(tag)">{{ tag }}</button>
    }
  </div>
</div>

@if (!projects.length) {
  <p class="no-results">{{ 'PORTFOLIO.NO_RESULTS' | translate }}</p>
}

<div class="project-grid">
  @for (project of projects; track project) {
    <app-project-card [project]="project"></app-project-card>
  }
</div>
