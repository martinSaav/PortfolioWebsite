
<div class="mt-4">
    <h1 class="text-center">{{ 'PORTFOLIO.TITLE' | translate }}</h1>
    <p class="text-center">{{ 'PORTFOLIO.DESC' | translate }}</p>
</div>

<div class="mb-2">
    <div>
        <button class="btn btn-outline-primary mb-2 me-2" (click)="toggleCollapse()">
            {{ 'PORTFOLIO.FILTER' | translate }}
            <span *ngIf="filtering" class="filter-count">{{ selectedTags.length }}</span>
        </button>
        <button class="btn btn-outline-secondary mb-2 me-2" (click)="clearFilter()" [hidden]="!filtering">{{ 'PORTFOLIO.CLEAR' | translate }}</button>
    </div>
</div>

<div [@expandCollapse]="isCollapsed ? 'collapsed' : 'expanded'">
    <div class="filter-panel mb-3">
        <small class="filter-label"><b>{{ 'PORTFOLIO.TECHNOLOGIES' | translate }}</b></small>
        <div class="filter-tags">
            <button *ngFor="let tag of availableTags"
                    type="button"
                    class="tag filter-tag"
                    [class.selected]="isSelected(tag)"
                    [style.color]="tag.color"
                    (click)="toggleTag(tag)">{{ tag }}</button>
        </div>
    </div>
</div>

<p *ngIf="!projects.length" class="text-center no-results">{{ 'PORTFOLIO.NO_RESULTS' | translate }}</p>

<div class="row">
    <div *ngFor="let project of projects" class="col-lg-4 col-md-6 col-sm-12 mb-4 d-flex project-col">
        <app-project-card [project]="project" ></app-project-card>
    </div>
</div>
