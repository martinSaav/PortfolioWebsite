<div>
  <app-section-header eyebrowKey="CERT.EYEBROW" headingKey="CERT.TITLE" subKey="CERT.DESC"></app-section-header>

  <div *ngFor="let group of certsByCategory" class="cert-group mb-4">
    <div class="cert-group-head" (click)="toggleGroup(group)">
      <p class="group-label">{{ group.categoryKey | translate }}</p>
      <span class="group-count">{{ group.certs.length }}</span>
      <span class="group-rule"></span>
      <button type="button"
              class="group-toggle"
              [attr.aria-expanded]="group.expanded"
              [attr.aria-label]="(group.expanded ? 'CERT.COLLAPSE' : 'CERT.EXPAND') | translate">{{ group.expanded ? '−' : '+' }}</button>
    </div>

    <!-- Colapsada: sólo los logos en una fila. -->
    <div *ngIf="!group.expanded" class="cert-strip" (click)="toggleGroup(group)">
      <img *ngFor="let cert of group.certs"
           [src]="cert.image"
           [alt]="cert.nameKey | translate"
           [title]="(cert.nameKey | translate) + ' · ' + cert.issuingOrganization"
           class="strip-logo">
    </div>

    <div [@expandCollapse]="group.expanded ? 'expanded' : 'collapsed'">
      <div class="cert-grid">
        <!-- El tile entero es el link, asi no hace falta una linea aparte de
             "Ver certificado" repetida en cada tarjeta. -->
        <a *ngFor="let cert of group.certs; let ci = index"
           class="cert-tile"
           [style.animation-delay.ms]="getCertDelay(ci)"
           [href]="cert.credentialUrl || null"
           [attr.target]="cert.credentialUrl ? '_blank' : null"
           rel="noopener">
          <img [src]="cert.image" [alt]="cert.nameKey | translate" class="cert-logo">
          <div class="cert-info">
            <p class="cert-name">{{ cert.nameKey | translate }}</p>
            <p class="cert-meta">{{ cert.issuingOrganization }} · {{ cert.issueDate | date:'MM/yyyy' }}</p>
          </div>
          <span *ngIf="cert.credentialUrl" class="cert-arrow">→</span>
        </a>
      </div>
    </div>
  </div>
</div>
